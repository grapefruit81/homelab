name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SG_ID: ${{ secrets.EC2_SG_ID }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Ansible and boto3
        run: pip install "ansible-core~=2.16.0" --upgrade boto3 botocore

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: aws/ansible

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/Ansible-practice-key.pem
          chmod 400 ~/.ssh/Ansible-practice-key.pem

      - name: Fail if no servers were found
        run: |
          COUNT=$(ansible-inventory -i aws_ec2.yml --list | python3 -c 'import sys, json; print(len(json.load(sys.stdin).get("_meta", {}).get("hostvars", {})))')
          echo "Found $COUNT servers"
          test "$COUNT" -gt 0
        working-directory: aws/ansible

      - name: Allow this runner to reach SSH
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

      - name: Deploy with Ansible
        run: ansible-playbook -i aws_ec2.yml deploy-hello.yml
        working-directory: aws/ansible

      - name: Remove runner SSH access
        if: always()
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32"
